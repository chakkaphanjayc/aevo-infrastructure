name: Aevo Infrastructure Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, envs/nonprod, envs/prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=${{ matrix.stack }} init -backend=false
      - run: terraform -chdir=${{ matrix.stack }} validate
